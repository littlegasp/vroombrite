<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Staff — Vroombrite</title>
<meta name="description" content="Vroombrite staff app.">
<link rel="canonical" href="https://littlegasp.github.io/vroombrite/ops.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Vroombrite">
<meta property="og:locale" content="en_IN">
<meta property="og:url" content="https://littlegasp.github.io/vroombrite/ops.html">
<meta property="og:title" content="Staff — Vroombrite">
<meta property="og:description" content="Vroombrite staff app.">
<meta property="og:image" content="https://littlegasp.github.io/vroombrite/img/og-home.jpg">
<meta property="og:image:secure_url" content="https://littlegasp.github.io/vroombrite/img/og-home.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Vroombrite — doorstep car & bike wash in Mumbai">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Staff — Vroombrite">
<meta name="twitter:description" content="Vroombrite staff app.">
<meta name="twitter:image" content="https://littlegasp.github.io/vroombrite/img/og-home.jpg">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#15191C">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="ops.css">
<link rel="manifest" href="ops.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VB Staff">
</head>
<body data-page="ops">

<main>
<div class="app" id="app">

  <section class="gate" id="scrSetup" hidden>
    <div class="gate-card">
      <svg class="vi" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#C9F36A"/><path d="M19 17h10l5 18 9-18h10L38 48H28z" fill="#0F1214"/><path d="M7 22h11l-1.6 4H5.4zM5 30h10l-1.6 4H3.4zM7 38h8l-1.6 4H5.4z" fill="#0F1214"/><path d="M52 6l1.6 4.4L58 12l-4.4 1.6L52 18l-1.6-4.4L46 12l4.4-1.6z" fill="#0F1214"/></svg>
      <h1>Staff app not connected</h1>
      <p>Add the Supabase Project URL and key to <code>src/config.js</code>, then rebuild.</p>
    </div>
  </section>

  <section class="gate" id="scrLogin" hidden>
    <form class="gate-card" id="loginForm" novalidate>
      <svg class="vi" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#C9F36A"/><path d="M19 17h10l5 18 9-18h10L38 48H28z" fill="#0F1214"/><path d="M7 22h11l-1.6 4H5.4zM5 30h10l-1.6 4H3.4zM7 38h8l-1.6 4H5.4z" fill="#0F1214"/><path d="M52 6l1.6 4.4L58 12l-4.4 1.6L52 18l-1.6-4.4L46 12l4.4-1.6z" fill="#0F1214"/></svg>
      <h1>Vroombrite Staff</h1>
      <label class="fld"><span>Email</span><input id="lgEmail" type="email" autocomplete="username" inputmode="email" placeholder="you@example.com"></label>
      <label class="fld"><span>Password</span><input id="lgPass" type="password" autocomplete="current-password" placeholder="••••••••"></label>
      <button class="b b-lime b-lg" type="submit" id="lgBtn">Sign in</button>
      <p class="msg bad" id="lgErr" hidden></p>
      <p class="hint">Forgot your password? Ask the owner to reset it.</p>
    </form>
  </section>

  <section class="gate" id="scrWait" hidden>
    <div class="gate-card">
      <h1>Almost there</h1>
      <p>Your login works, but the owner still needs to switch it on in <b>Team</b>.</p>
      <button class="b b-ghost" type="button" id="waitRetry">Check again</button>
      <button class="b b-text" type="button" data-signout>Sign out</button>
    </div>
  </section>

  <div class="shell" id="shell" hidden>
    <header class="top">
      <div class="top-l">
        <svg class="vi sm" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#C9F36A"/><path d="M19 17h10l5 18 9-18h10L38 48H28z" fill="#0F1214"/><path d="M7 22h11l-1.6 4H5.4zM5 30h10l-1.6 4H3.4zM7 38h8l-1.6 4H5.4z" fill="#0F1214"/><path d="M52 6l1.6 4.4L58 12l-4.4 1.6L52 18l-1.6-4.4L46 12l4.4-1.6z" fill="#0F1214"/></svg>
        <div><h1 id="title">Today</h1><p id="subtitle"></p></div>
      </div>
      <div class="top-r">
        <span class="sync" id="sync" title="Up to date"></span>
        <button class="me" type="button" id="meBtn" aria-label="Account"></button>
      </div>
    </header>
    <nav class="views" id="views" aria-label="Sections"></nav>

    <main class="main">
      <section data-view="day">
        <div class="strip" id="strip" role="tablist" aria-label="Choose a day"></div>
        <div class="daybar" id="daybar"></div>
        <div id="dayBody"></div>
      </section>

      <section data-view="bookings" hidden>
        <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Search name, phone, plate, area, booking ID" autocomplete="off"></label>
        <div id="bkBody"></div>
      </section>

      <section data-view="customers" hidden>
        <div class="chips" id="dueChips"></div>
        <p class="lead" id="dueLead"></p>
        <div id="dueBody"></div>
      </section>

      <section data-view="inbox" hidden>
        <div class="seg" id="inTabs"></div>
        <div id="inBody"></div>
      </section>

      <section data-view="numbers" hidden>
        <div id="numBody"></div>
      </section>

      <section data-view="team" hidden>
        <div id="teamBody"></div>
      </section>
    </main>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grip"></div>
      <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="b b-icon" type="button" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

</main>

<script src="config.js"></script><script src="ops.js"></script>
</body>
</html>
