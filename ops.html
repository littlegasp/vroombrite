<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:ital,wght@0,600;0,700;0,800;1,800;1,900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="ops">

<main>
<div class="ops gut">
  <header class="ops-top wrap">
    <div class="brand"><svg class="vicon" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#C9F36A"/><path d="M19 17h10l5 18 9-18h10L38 48H28z" fill="#15191C"/><path d="M7 22h11l-1.6 4H5.4zM5 30h10l-1.6 4H3.4zM7 38h8l-1.6 4H5.4z" fill="#15191C"/><path d="M52 6l1.6 4.4L58 12l-4.4 1.6L52 18l-1.6-4.4L46 12l4.4-1.6z" fill="#15191C"/></svg><span class="wm"><b>VROOM<i>BRITE</i></b><small>STAFF</small></span></div>
    <div class="ops-who" id="who" hidden><span class="role" id="roleChip"></span><button type="button" class="copy" id="signOut">Sign out</button></div>
  </header>

  <section class="ops-login wrap" id="login">
    <div class="bform" style="max-width:420px;margin:12vh auto 0">
      <div class="kicker">Staff sign-in</div>
      <h2 class="big" style="font-size:2.2rem">Enter your PIN.</h2>
      <form id="pinForm" novalidate style="display:flex;flex-direction:column;gap:14px;margin-top:22px">
        <div class="f"><label for="ops-pin">PIN</label><input id="ops-pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="••••"></div>
        <button class="btn btn-lime" type="submit">Sign in</button>
        <p class="status warn" id="loginErr" hidden></p>
      </form>
      <p class="note">The owner sets PINs in the Google Sheet: Vroombrite menu → Set staff PINs.</p>
    </div>
  </section>

  <main class="wrap" id="app" hidden>
    <nav class="ops-tabs" role="tablist" aria-label="Staff sections">
      <button type="button" role="tab" id="tab-jobs" data-tab="jobs" aria-selected="true">Jobs</button>
      <button type="button" role="tab" id="tab-dash" data-tab="dash" data-owner aria-selected="false">Dashboard</button>
      <button type="button" role="tab" id="tab-due" data-tab="due" data-owner aria-selected="false">Due</button>
      <button type="button" role="tab" id="tab-leads" data-tab="leads" data-owner aria-selected="false">Societies</button>
    </nav>

    <section data-panel="jobs">
      <div class="ops-date">
        <button type="button" class="copy" id="dPrev" aria-label="Previous day">‹</button>
        <input type="date" id="dPick" aria-label="Jobs date">
        <button type="button" class="copy" id="dNext" aria-label="Next day">›</button>
        <button type="button" class="copy" id="dToday">Today</button>
        <button type="button" class="copy" id="dRefresh">Refresh</button>
      </div>
      <p class="ops-sum" id="jobsSum"></p>
      <div class="ops-list" id="jobs"></div>
    </section>

    <section data-panel="dash" hidden>
      <div class="tiles" id="tiles"></div>
      <div class="cgrid" style="margin-top:18px">
        <div class="cbox"><h3>Bookings, last 7 days</h3><div class="bars" id="bars"></div></div>
        <div class="cbox"><h3>Top packages</h3><div class="hours" id="pkgs"></div><p class="note" id="todo" style="margin:0"></p></div>
      </div>
    </section>

    <section data-panel="due" hidden>
      <div class="ops-date">
        <label for="dueDays" class="lb" style="font-size:.84rem;color:var(--muted)">Last wash at least</label>
        <select id="dueDays"><option value="7">7 days ago</option><option value="12" selected>12 days ago</option><option value="21">21 days ago</option><option value="30">30 days ago</option></select>
      </div>
      <p class="ops-sum" id="dueSum"></p>
      <div class="ops-list" id="due"></div>
    </section>

    <section data-panel="leads" hidden>
      <p class="ops-sum">Society quote requests, newest first. Update their status in the Sheet → Society leads tab.</p>
      <div class="ops-list" id="leads"></div>
    </section>
  </main>
</div>


</main>

<script src="app.js"></script><script src="ops.js"></script>
</body>
</html>
