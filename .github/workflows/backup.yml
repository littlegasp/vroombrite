# Nightly backup of the Vroombrite database (about 2 am India time).
#
# The repo is public, so the backup is locked with a passphrase before it is stored, and kept
# for 30 days as a download on the workflow run (Actions → Nightly database backup → a run → Artifacts).
#
# Needs two secrets (Settings → Secrets and variables → Actions → New repository secret).
# Paste them only there, never in chat or in a file:
#   SUPABASE_DB_URL     Supabase → Connect → Session pooler connection string, with the database password filled in
#   BACKUP_PASSPHRASE   a long passphrase you make up and keep safe; you need it to open a backup
#
# To open a backup:  gpg -d vroombrite-YYYY-MM-DD.sql.gz.gpg | gunzip > backup.sql
# Photos in Storage are not in this backup.
name: Nightly database backup
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASS: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            echo "::error::Add SUPABASE_DB_URL and BACKUP_PASSPHRASE in Settings → Secrets and variables → Actions."; exit 1
          fi
      - name: Dump, compress and lock
        run: |
          set -euo pipefail
          stamp=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          docker run --rm -e DB_URL postgres:17 sh -c '
            set -e
            pg_dump "$DB_URL" --no-owner --no-privileges --schema=public
            pg_dump "$DB_URL" --no-owner --no-privileges --data-only --table=auth.users --table=auth.identities
          ' > dump.sql
          test -s dump.sql
          gzip -9 dump.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o "vroombrite-$stamp.sql.gz.gpg" dump.sql.gz
          shred -u dump.sql.gz
          ls -lh vroombrite-*.gpg
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: vroombrite-backup-${{ env.STAMP }}
          path: vroombrite-*.sql.gz.gpg
          retention-days: 30
          if-no-files-found: error
